<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00274c" />
    <title>Offline — Campus Ready</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
        background: #fafafa;
        color: #18181b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #00274c; }
      p { font-size: 0.9rem; line-height: 1.5; color: #52525b; margin: 0 0 1rem; }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #00274c;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #fafafa; }
        h1 { color: #fff; }
        p { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved on this device yet. Pages you've already opened while
        connected are available offline — reconnect to load this one.
      </p>
      <a href="/">Back to start</a>
    </main>
  </body>
</html>
